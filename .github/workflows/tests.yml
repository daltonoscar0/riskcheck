name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests scripts

      # The suite runs entirely on synthetic data and fixture files. A
      # conftest fixture blocks socket creation for the duration, so a test
      # that tried to reach the Kenneth French data library would fail rather
      # than make CI depend on a web server being up.
      - name: Test (offline)
        run: pytest -q
