[project]
name = "riskcheck"
version = "0.1.0"
description = "Walk-forward validation of equity covariance forecasts on Kenneth French portfolio data, in JAX."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
authors = [{ name = "Oscar Dalton", email = "daltonoscar0@gmail.com" }]
keywords = ["risk-model", "covariance", "jax", "bias-statistic", "minimum-variance"]
dependencies = [
    "jax>=0.4.30",
    "jaxlib>=0.4.30",
    "numpy>=1.26",
    "pandas>=2.1",
    "matplotlib>=3.8",
    "pyarrow>=15.0",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
riskcheck = "riskcheck.cli:main"

[project.urls]
Homepage = "https://github.com/daltonoscar0/riskcheck"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/riskcheck"]

[tool.ruff]
line-length = 99
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# typer declares CLI options as argument defaults; that is the library's whole idiom.
"src/riskcheck/cli.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
